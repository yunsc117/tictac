<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b09" id="themeColorMeta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Metronome</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Themes ─────────────────────────────────── */
    :root {
      --bg:       #0d0b09;
      --surface:  #1b1813;
      --surface2: #27211a;
      --accent:   #FF6600;
      --accent2:  #BF4000;
      --text:     #ede8e0;
      --text-dim: #7a6e60;
      --radius: 16px;
      --shadow: 0 8px 48px rgba(0,0,0,0.55);
    }
    [data-theme="light"] {
      --bg:       #faf7f3;
      --surface:  #ffffff;
      --surface2: #f0e9e0;
      --accent:   #E55000;
      --accent2:  #993400;
      --text:     #1a1208;
      --text-dim: #8c7060;
      --shadow: 0 8px 40px rgba(0,0,0,0.1);
    }

    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      transition: background 0.25s;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 16px) max(env(safe-area-inset-right), 16px)
               max(env(safe-area-inset-bottom), 16px) max(env(safe-area-inset-left), 16px);
      gap: 14px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.25s;
    }

    /* ─── Header ─────────────────────────────────── */
    .header { display: flex; align-items: center; gap: 12px; }
    h1 {
      font-size: 1rem; font-weight: 500;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .theme-switch {
      display: flex; align-items: center; gap: 5px;
      background: none; border: none;
      cursor: pointer; touch-action: manipulation;
      font-size: 0.8rem; line-height: 1;
      padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .theme-switch:active { opacity: 0.65; }
    .switch-track {
      width: 44px; height: 24px;
      border-radius: 12px;
      background: var(--surface2);
      position: relative;
      flex-shrink: 0;
      transition: background 0.25s;
    }
    [data-theme="dark"] .switch-track { background: var(--accent); }
    .switch-thumb {
      width: 18px; height: 18px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 3px; left: 3px;
      transition: transform 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    [data-theme="dark"] .switch-thumb { transform: translateX(20px); }

    /* ─── Card ───────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: clamp(14px, 5vw, 28px) clamp(14px, 6vw, 32px);
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      width: 100%; max-width: 440px;
      box-shadow: var(--shadow);
      transition: background 0.25s, box-shadow 0.25s;
    }
    .col-left, .col-right {
      display: flex; flex-direction: column;
      align-items: center; gap: 16px; width: 100%;
    }

    /* ─── Pendulum ───────────────────────────────── */
    .pendulum-wrap {
      --psize: min(180px, 62vw);
      width: var(--psize); height: var(--psize);
      position: relative;
      display: flex; align-items: flex-start; justify-content: center;
      flex-shrink: 0;
    }
    .pendulum-pivot {
      width: 14px; height: 14px;
      background: var(--text-dim); border-radius: 50%;
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%); z-index: 2;
    }
    .pendulum-arm {
      width: 3px;
      height: calc(var(--psize) * 0.818);
      background: linear-gradient(to bottom, var(--text-dim), var(--accent));
      border-radius: 2px;
      position: absolute; top: 7px; left: 50%;
      transform-origin: top center;
      transform: translateX(-50%) rotate(0deg);
    }
    .pendulum-arm.swing-left  { animation: swingLeft  var(--beat-dur,.5s) ease-in-out forwards; }
    .pendulum-arm.swing-right { animation: swingRight var(--beat-dur,.5s) ease-in-out forwards; }
    @keyframes swingLeft  { from { transform: translateX(-50%) rotate( 30deg); } to { transform: translateX(-50%) rotate(-30deg); } }
    @keyframes swingRight { from { transform: translateX(-50%) rotate(-30deg); } to { transform: translateX(-50%) rotate( 30deg); } }

    .pendulum-bob {
      width: calc(var(--psize) * 0.18); height: calc(var(--psize) * 0.18);
      background: var(--accent); border-radius: 50%;
      position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 20px var(--accent);
      transition: background 0.1s, box-shadow 0.1s;
    }
    .pendulum-bob.accent { background: var(--accent2); box-shadow: 0 0 28px var(--accent2); }

    /* ─── BPM block ──────────────────────────────── */
    .bpm-block { text-align: center; width: 100%; }
    .bpm-row { display: flex; align-items: center; justify-content: center; gap: 10px; }

    .adj-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--surface2); border: none;
      color: var(--text); font-size: 1.6rem; line-height: 1;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.08s;
      flex-shrink: 0; user-select: none;
    }
    .adj-btn:hover  { background: var(--accent); color: #fff; }
    .adj-btn:active { transform: scale(0.9); }

    .bpm-display {
      font-size: clamp(3.4rem, 13vw, 5rem);
      font-weight: 700; letter-spacing: -2px; line-height: 1;
      color: var(--text); min-width: 130px; text-align: center;
      cursor: text; user-select: none; touch-action: none;
      border-bottom: 2px solid transparent; padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    .bpm-display:hover { border-bottom-color: var(--accent); }

    .bpm-input {
      font-size: clamp(3.4rem, 13vw, 5rem);
      font-weight: 700; letter-spacing: -2px; line-height: 1;
      color: var(--accent); width: 160px; min-width: 130px; text-align: center;
      background: transparent; border: none;
      border-bottom: 2px solid var(--accent);
      outline: none; display: none; padding-bottom: 2px;
      -moz-appearance: textfield;
    }
    .bpm-input::-webkit-outer-spin-button,
    .bpm-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .bpm-input.show { display: block; }

    .bpm-label  { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.2em; margin-top: 4px; }
    .tempo-name { font-size: 0.85rem; color: var(--accent); letter-spacing: 0.1em; min-height: 1.2em; margin-top: 2px; }

    /* ─── Slider ─────────────────────────────────── */
    .slider-wrap { width: 100%; max-width: 300px; }
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 6px;
      background: var(--surface2); border-radius: 3px;
      outline: none; cursor: pointer; touch-action: manipulation;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 28px; height: 28px;
      background: var(--accent); border-radius: 50%;
      box-shadow: 0 0 8px var(--accent); cursor: grab;
    }
    input[type=range]:active::-webkit-slider-thumb { cursor: grabbing; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-dim); margin-top: 6px; }

    /* ─── Beat dots ──────────────────────────────── */
    .beats-row { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; min-height: 20px; }
    .beat-dot {
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--surface2); border: 2px solid var(--surface2); flex-shrink: 0;
      transition: background 0.08s, border-color 0.08s, box-shadow 0.08s;
    }
    .beat-dot.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .beat-dot.active.accent-dot { background: var(--accent2); border-color: var(--accent2); box-shadow: 0 0 14px var(--accent2); }

    /* ─── Sub-beat dots ──────────────────────────── */
    .sub-beats-row { display: none; gap: 10px; justify-content: center; align-items: center; min-height: 14px; }
    .sub-beat-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--surface2); border: 1.5px solid var(--surface2); flex-shrink: 0;
      transition: background 0.06s, border-color 0.06s, box-shadow 0.06s;
    }
    .sub-beat-dot.active { background: var(--accent2); border-color: var(--accent2); box-shadow: 0 0 8px var(--accent2); }

    /* ─── Time signature dropdown ────────────────── */
    .sig-select { position: relative; width: 100%; max-width: 300px; }

    .sig-trigger {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface2); border: 2px solid transparent;
      border-radius: 10px; padding: 12px 16px;
      font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em;
      color: var(--text);
      cursor: pointer; touch-action: manipulation;
      transition: border-color 0.15s, border-radius 0.15s;
    }
    .sig-trigger:hover { border-color: var(--accent); }
    .sig-trigger.open  { border-color: var(--accent); border-radius: 10px 10px 0 0; }

    .sig-chevron { flex-shrink: 0; color: var(--text-dim); transition: transform 0.2s; }
    .sig-trigger.open .sig-chevron { transform: rotate(180deg); }

    .sig-menu {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--surface);
      border: 2px solid var(--accent); border-top: none;
      border-radius: 0 0 10px 10px;
      display: none;
      grid-template-columns: repeat(4, 1fr);
      z-index: 300; overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .sig-menu.open { display: grid; }

    .sig-opt {
      padding: 12px 4px; font-size: 0.9rem; font-weight: 500;
      border: none; background: transparent; color: var(--text-dim);
      cursor: pointer; touch-action: manipulation; text-align: center;
      border-right: 1px solid var(--surface2);
      border-bottom: 1px solid var(--surface2);
      transition: background 0.1s, color 0.1s;
    }
    .sig-opt:nth-child(4n)  { border-right: none; }
    .sig-opt:nth-child(n+5) { border-bottom: none; }
    .sig-opt:hover  { background: var(--surface2); color: var(--text); }
    .sig-opt.active { background: var(--accent); color: #fff; }

    /* ─── Sig + Subdivision row ──────────────────── */
    .sig-subdiv-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      width: 100%;
    }
    .sig-subdiv-row .sig-select { flex: 1; max-width: none; }
    .sig-subdiv-row .sig-trigger { height: 100%; }

    .subdiv-group { display: flex; gap: 6px; }

    .subdiv-btn {
      background: var(--surface2); border: 2px solid transparent;
      color: var(--text-dim); border-radius: 10px;
      padding: 10px 12px; min-height: 48px;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .subdiv-btn:hover  { border-color: var(--accent); color: var(--text); }
    .subdiv-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    /* SVG note icons inherit currentColor */
    .subdiv-btn svg { display: block; overflow: visible; }

    /* ─── Play button ────────────────────────────── */
    .play-btn {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--accent); border: none;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 28px color-mix(in srgb, var(--accent) 55%, transparent);
      transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
    }
    .play-btn:hover  { transform: scale(1.07); }
    .play-btn:active { transform: scale(0.95); }
    .play-btn.running {
      background: var(--accent2);
      box-shadow: 0 0 28px color-mix(in srgb, var(--accent2) 55%, transparent);
    }
    .play-btn svg { width: 28px; height: 28px; fill: #fff; }

    /* ─── Small screens ──────────────────────────── */
    @media (max-width: 360px) {
      .adj-btn     { width: 42px; height: 42px; font-size: 1.4rem; }
      .subdiv-btn  { padding: 8px 14px; }
      .beat-dot    { width: 12px; height: 12px; }
      .sig-opt     { font-size: 0.82rem; padding: 10px 4px; }
    }

    /* ─── Landscape ──────────────────────────────── */
    @media (orientation: landscape) and (max-height: 500px) {
      body { padding: 8px; gap: 8px; }
      .header { display: none; }
      .card {
        flex-direction: row; align-items: center; justify-content: center;
        max-width: 820px; gap: 20px; padding: 12px 20px;
      }
      .col-left { gap: 10px; flex-shrink: 0; }
      .col-right { gap: 10px; }
      .pendulum-wrap { --psize: min(148px, 36vh); }
      .bpm-display { font-size: clamp(2.5rem, 10vw, 3.4rem); }
      .sig-trigger { font-size: 0.95rem; padding: 10px 14px; }
      .sig-opt     { font-size: 0.8rem; padding: 9px 4px; }
      .subdiv-btn  { padding: 8px 14px; min-height: 42px; }
      .play-btn    { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>Metronome</h1>
  <button class="theme-switch" id="themeBtn" aria-label="테마 전환">
    <span>☀️</span>
    <span class="switch-track"><span class="switch-thumb"></span></span>
    <span>🌙</span>
  </button>
</div>

<div class="card">
  <div class="col-left">

    <div class="pendulum-wrap">
      <div class="pendulum-pivot"></div>
      <div class="pendulum-arm" id="arm">
        <div class="pendulum-bob" id="bob"></div>
      </div>
    </div>

    <div class="bpm-block">
      <div class="bpm-row">
        <button class="adj-btn" id="bpmMinus" aria-label="BPM -1">−</button>
        <div id="bpmWrapper">
          <div class="bpm-display" id="bpmDisplay">120</div>
          <input class="bpm-input" id="bpmInput" type="number" inputmode="numeric" min="20" max="240" value="120" />
        </div>
        <button class="adj-btn" id="bpmPlus" aria-label="BPM +1">+</button>
      </div>
      <div class="bpm-label">BPM · tap to edit</div>
      <div class="tempo-name" id="tempoName">Allegretto</div>
    </div>

  </div>
  <div class="col-right">

    <div class="slider-wrap">
      <input type="range" id="bpmSlider" min="20" max="240" value="120" />
      <div class="slider-labels"><span>20</span><span>240</span></div>
    </div>

    <div class="beats-row" id="beatsRow"></div>
    <div class="sub-beats-row" id="subBeatsRow"></div>

    <!-- Time signature dropdown + subdivision in one row -->
    <div class="sig-subdiv-row">

      <div class="sig-select" id="sigSelect">
        <button class="sig-trigger" id="sigTrigger" aria-haspopup="listbox" aria-expanded="false">
          <span id="sigLabel">4/4</span>
          <svg class="sig-chevron" viewBox="0 0 12 7" width="12" height="7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1l5 5 5-5"/>
          </svg>
        </button>
        <div class="sig-menu" id="sigMenu" role="listbox" aria-hidden="true">
          <button class="sig-opt" data-beats="1" data-label="1/4">1/4</button>
          <button class="sig-opt" data-beats="2" data-label="2/4">2/4</button>
          <button class="sig-opt" data-beats="3" data-label="3/4">3/4</button>
          <button class="sig-opt active" data-beats="4" data-label="4/4">4/4</button>
          <button class="sig-opt" data-beats="3" data-label="3/8">3/8</button>
          <button class="sig-opt" data-beats="6" data-label="6/8">6/8</button>
          <button class="sig-opt" data-beats="9" data-label="9/8">9/8</button>
          <button class="sig-opt" data-beats="12" data-label="12/8">12/8</button>
        </div>
      </div>

      <div class="subdiv-group" id="subdivGroup">

        <!-- ♩ 4분음표 (quarter note) -->
        <button class="subdiv-btn active" data-subdiv="1" aria-label="4분음표" title="4분음표">
          <svg viewBox="0 0 11 22" width="13" height="24" fill="currentColor">
            <ellipse cx="4" cy="18" rx="4" ry="2.8" transform="rotate(-15,4,18)"/>
            <rect x="7.2" y="1" width="1.6" height="17" rx="0.8"/>
          </svg>
        </button>

        <!-- ♪ 8분음표 (eighth note) -->
        <button class="subdiv-btn" data-subdiv="2" aria-label="8분음표" title="8분음표">
          <svg viewBox="0 0 16 22" width="16" height="24" fill="currentColor">
            <ellipse cx="4" cy="18" rx="4" ry="2.8" transform="rotate(-15,4,18)"/>
            <rect x="7.2" y="1" width="1.6" height="17" rx="0.8"/>
            <path d="M8.8 1.5 C15 4, 15 10, 10.5 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- ♬ 16분음표 (sixteenth note) -->
        <button class="subdiv-btn" data-subdiv="4" aria-label="16분음표" title="16분음표">
          <svg viewBox="0 0 16 22" width="16" height="24" fill="currentColor">
            <ellipse cx="4" cy="18" rx="4" ry="2.8" transform="rotate(-15,4,18)"/>
            <rect x="7.2" y="1" width="1.6" height="17" rx="0.8"/>
            <path d="M8.8 1.5 C15 4, 15 10, 10.5 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M8.8 6   C15 8.5, 15 14.5, 10.5 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>

      </div>

    </div><!-- /.sig-subdiv-row -->

    <button class="play-btn" id="playBtn" aria-label="재생/정지">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

  </div>
</div>

<script>
  /* ── State ── */
  let bpm = 120;
  let beatsPerBar = 4;
  let subdiv = 1;           // 1=quarter, 2=eighth, 4=sixteenth
  let running = false;
  let subdivClickCount = 0;
  let nextBeatTime = 0;
  let schedulerTimer = null;
  let swingDir = 1;
  let audioCtx = null;
  let currentSigLabel = '4/4';

  const LOOKAHEAD_MS   = 25;
  const SCHEDULE_AHEAD = 0.1;

  /* ── DOM ── */
  const bpmDisplay     = document.getElementById('bpmDisplay');
  const bpmInput       = document.getElementById('bpmInput');
  const tempoName      = document.getElementById('tempoName');
  const bpmSlider      = document.getElementById('bpmSlider');
  const beatsRow       = document.getElementById('beatsRow');
  const subBeatsRow    = document.getElementById('subBeatsRow');
  const playBtn        = document.getElementById('playBtn');
  const playIcon       = document.getElementById('playIcon');
  const sigTrigger     = document.getElementById('sigTrigger');
  const sigMenu        = document.getElementById('sigMenu');
  const sigLabel       = document.getElementById('sigLabel');
  const subdivGroup    = document.getElementById('subdivGroup');
  const arm            = document.getElementById('arm');
  const bob            = document.getElementById('bob');
  const themeBtn       = document.getElementById('themeBtn');
  const themeColorMeta = document.getElementById('themeColorMeta');

  /* ── Tempo names ── */
  const tempoMap = [
    [20,'Larghissimo'],[40,'Grave'],[60,'Largo'],[66,'Larghetto'],
    [76,'Adagio'],[84,'Andante'],[98,'Andantino'],[108,'Moderato'],
    [116,'Allegretto'],[132,'Allegro'],[168,'Presto'],[200,'Prestissimo'],
  ];
  function getTempoName(b) {
    let name = tempoMap[0][1];
    for (const [t, n] of tempoMap) { if (b >= t) name = n; }
    return name;
  }

  /* ── Dots ── */
  function buildDots() {
    beatsRow.innerHTML = '';
    for (let i = 0; i < beatsPerBar; i++) {
      const d = document.createElement('div');
      d.className = 'beat-dot' + (i === 0 ? ' accent-dot' : '');
      beatsRow.appendChild(d);
    }
  }
  function buildSubDots() {
    subBeatsRow.innerHTML = '';
    if (subdiv <= 1) { subBeatsRow.style.display = 'none'; return; }
    subBeatsRow.style.display = 'flex';
    for (let i = 0; i < subdiv; i++) {
      const d = document.createElement('div');
      d.className = 'sub-beat-dot';
      subBeatsRow.appendChild(d);
    }
  }
  buildDots(); buildSubDots();

  function highlightDot(beat, sub) {
    beatsRow.querySelectorAll('.beat-dot').forEach((d, i) => d.classList.toggle('active', i === beat));
    bob.classList.toggle('accent', beat === 0 && sub === 0);
    if (subdiv > 1) {
      subBeatsRow.querySelectorAll('.sub-beat-dot').forEach((d, i) => d.classList.toggle('active', i === sub));
    }
  }

  /* ── Audio ── */
  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function scheduleClick(time, isAccent, isOnBeat) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (isAccent)      { osc.frequency.value = 1200; gain.gain.setValueAtTime(0.85, time); }
    else if (isOnBeat) { osc.frequency.value = 900;  gain.gain.setValueAtTime(0.60, time); }
    else               { osc.frequency.value = 700;  gain.gain.setValueAtTime(0.32, time); }
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
    osc.start(time); osc.stop(time + 0.05);
  }

  /* ── Visual queue ── */
  const visualQueue = [];
  function processVisuals() {
    const now = audioCtx ? audioCtx.currentTime : 0;
    while (visualQueue.length && visualQueue[0].time <= now) {
      const ev = visualQueue.shift();
      highlightDot(ev.beat, ev.sub);
      if (ev.sub === 0) swingPendulum();
    }
    if (running) requestAnimationFrame(processVisuals);
  }

  /* ── Pendulum ── */
  function swingPendulum() {
    arm.style.setProperty('--beat-dur', (60 / bpm).toFixed(3) + 's');
    arm.classList.remove('swing-left', 'swing-right');
    void arm.offsetWidth;
    arm.classList.add(swingDir > 0 ? 'swing-right' : 'swing-left');
    swingDir *= -1;
  }

  /* ── Scheduler ── */
  function scheduler() {
    const now = audioCtx.currentTime;
    const barLength = beatsPerBar * subdiv;
    const clickInterval = (60 / bpm) / subdiv;
    while (nextBeatTime < now + SCHEDULE_AHEAD) {
      const posInBar = subdivClickCount % barLength;
      const beat = Math.floor(posInBar / subdiv);
      const sub  = posInBar % subdiv;
      scheduleClick(nextBeatTime, posInBar === 0, sub === 0);
      visualQueue.push({ time: nextBeatTime, beat, sub });
      nextBeatTime += clickInterval;
      subdivClickCount++;
    }
    schedulerTimer = setTimeout(scheduler, LOOKAHEAD_MS);
  }

  /* ── Play / Stop ── */
  function start() {
    ensureCtx();
    running = true; subdivClickCount = 0; swingDir = 1;
    nextBeatTime = audioCtx.currentTime + 0.05;
    scheduler();
    requestAnimationFrame(processVisuals);
    playBtn.classList.add('running');
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
  }
  function stop() {
    running = false;
    clearTimeout(schedulerTimer); visualQueue.length = 0;
    playBtn.classList.remove('running');
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    arm.classList.remove('swing-left', 'swing-right');
    arm.style.transform = 'translateX(-50%) rotate(0deg)';
    bob.classList.remove('accent');
    beatsRow.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('active'));
    subBeatsRow.querySelectorAll('.sub-beat-dot').forEach(d => d.classList.remove('active'));
  }
  playBtn.addEventListener('click', () => { running ? stop() : start(); });

  /* ── BPM ── */
  function setBpm(v) {
    bpm = Math.min(240, Math.max(20, Math.round(v)));
    bpmDisplay.textContent = bpm;
    bpmSlider.value = bpm;
    tempoName.textContent = getTempoName(bpm);
  }
  setBpm(120);

  bpmSlider.addEventListener('input', () => setBpm(+bpmSlider.value));

  bpmDisplay.addEventListener('wheel', e => {
    e.preventDefault();
    setBpm(bpm + (e.deltaY < 0 ? 1 : -1));
  }, { passive: false });

  /* Touch swipe on BPM display */
  let swipeStartY = null, bpmAtSwipe = 120;
  bpmDisplay.addEventListener('touchstart', e => {
    swipeStartY = e.touches[0].clientY; bpmAtSwipe = bpm;
  }, { passive: true });
  bpmDisplay.addEventListener('touchmove', e => {
    if (swipeStartY === null) return;
    e.preventDefault();
    setBpm(bpmAtSwipe + Math.round((swipeStartY - e.touches[0].clientY) / 8));
  }, { passive: false });
  bpmDisplay.addEventListener('touchend', e => {
    const moved = swipeStartY !== null && Math.abs(e.changedTouches[0].clientY - swipeStartY) < 5;
    swipeStartY = null;
    if (moved) openBpmInput();
  }, { passive: true });

  /* +/- buttons with hold-to-repeat */
  let adjTimer = null;
  function startAdj(delta) { setBpm(bpm + delta); adjTimer = setInterval(() => setBpm(bpm + delta), 100); }
  function stopAdj() { clearInterval(adjTimer); adjTimer = null; }
  const bpmMinus = document.getElementById('bpmMinus');
  const bpmPlus  = document.getElementById('bpmPlus');
  bpmMinus.addEventListener('pointerdown', e => { e.preventDefault(); startAdj(-1); });
  bpmPlus.addEventListener('pointerdown',  e => { e.preventDefault(); startAdj(+1); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => {
    bpmMinus.addEventListener(ev, stopAdj);
    bpmPlus.addEventListener(ev, stopAdj);
  });

  /* BPM direct input */
  bpmDisplay.addEventListener('click', openBpmInput);
  function openBpmInput() {
    bpmDisplay.style.display = 'none';
    bpmInput.value = bpm;
    bpmInput.classList.add('show');
    bpmInput.focus(); bpmInput.select();
  }
  function closeBpmInput() {
    const v = parseInt(bpmInput.value, 10);
    if (!isNaN(v)) setBpm(v);
    bpmInput.classList.remove('show');
    bpmDisplay.style.display = '';
  }
  bpmInput.addEventListener('blur', closeBpmInput);
  bpmInput.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); bpmInput.blur(); }
    if (e.key === 'Escape') { bpmInput.classList.remove('show'); bpmDisplay.style.display = ''; }
  });

  /* ── Time signature dropdown ── */
  function openSigMenu() {
    sigTrigger.classList.add('open');
    sigMenu.classList.add('open');
    sigTrigger.setAttribute('aria-expanded', 'true');
    sigMenu.setAttribute('aria-hidden', 'false');
  }
  function closeSigMenu() {
    sigTrigger.classList.remove('open');
    sigMenu.classList.remove('open');
    sigTrigger.setAttribute('aria-expanded', 'false');
    sigMenu.setAttribute('aria-hidden', 'true');
  }

  sigTrigger.addEventListener('click', e => {
    e.stopPropagation();
    sigTrigger.classList.contains('open') ? closeSigMenu() : openSigMenu();
  });
  sigMenu.addEventListener('click', e => {
    const btn = e.target.closest('.sig-opt');
    if (!btn) return;
    sigMenu.querySelectorAll('.sig-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    beatsPerBar = +btn.dataset.beats;
    currentSigLabel = btn.dataset.label;
    sigLabel.textContent = currentSigLabel;
    buildDots();
    closeSigMenu();
    if (running) { stop(); start(); }
  });
  document.addEventListener('click', e => {
    if (!sigTrigger.contains(e.target) && !sigMenu.contains(e.target)) closeSigMenu();
  });

  /* ── Subdivision ── */
  subdivGroup.addEventListener('click', e => {
    const btn = e.target.closest('.subdiv-btn');
    if (!btn) return;
    subdivGroup.querySelectorAll('.subdiv-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    subdiv = +btn.dataset.subdiv;
    buildSubDots();
    if (running) { stop(); start(); }
  });

  /* ── Theme ── */
  let isDark = true;
  function applyTheme(dark) {
    isDark = dark;
    const bg = dark ? '#0d0b09' : '#faf7f3';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.style.backgroundColor = bg;
    document.body.style.backgroundColor = bg;
    // theme-color: .content 직접 할당이 Safari에서 setAttribute보다 안정적
    themeColorMeta.content = bg;
    localStorage.setItem('metro-theme', dark ? 'dark' : 'light');
  }
  themeBtn.addEventListener('click', () => applyTheme(!isDark));
  if (localStorage.getItem('metro-theme') === 'light') applyTheme(false);

  /* ── Double-tap zoom prevention ── */
  let lastTap = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });

  /* ── Keyboard ── */
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space')     { e.preventDefault(); running ? stop() : start(); }
    if (e.code === 'ArrowUp')   { e.preventDefault(); setBpm(bpm + 1); }
    if (e.code === 'ArrowDown') { e.preventDefault(); setBpm(bpm - 1); }
    if (e.code === 'KeyD')      { applyTheme(!isDark); }
  });
</script>
</body>
</html>
