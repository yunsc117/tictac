<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0b09"/>

  <!-- Top accent bar -->
  <rect width="1200" height="6" fill="#FF6600"/>

  <!-- Subtle grid lines (decorative) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1b1813" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1b1813" stroke-width="1"/>

  <!-- Pendulum arm (decorative, left side) -->
  <g transform="translate(220, 120)">
    <circle cx="0" cy="0" r="10" fill="#4a4038"/>
    <rect x="-2" y="0" width="4" height="200" rx="2" fill="url(#armGrad)"/>
    <circle cx="0" cy="210" r="28" fill="#FF6600" opacity="0.9"/>
    <circle cx="0" cy="210" r="28" fill="none" stroke="#FF6600" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Pendulum arm (decorative, right side) -->
  <g transform="translate(980, 100) rotate(22)">
    <circle cx="0" cy="0" r="8" fill="#2a2218"/>
    <rect x="-1.5" y="0" width="3" height="170" rx="1.5" fill="#2a2218"/>
    <circle cx="0" cy="178" r="22" fill="#BF4000" opacity="0.3"/>
  </g>

  <!-- Gradient def for arm -->
  <defs>
    <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4038"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
  </defs>

  <!-- Main title -->
  <text x="600" y="248" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="96" font-weight="700" letter-spacing="-3"
        fill="#ede8e0">Metronome</text>

  <!-- Subtitle -->
  <text x="600" y="308" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="30" font-weight="400" letter-spacing="1"
        fill="#7a6e60">Free online metronome for musicians</text>

  <!-- Divider -->
  <rect x="500" y="338" width="200" height="2" rx="1" fill="#27211a"/>

  <!-- BPM showcase -->
  <text x="600" y="446" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="128" font-weight="700" letter-spacing="-4"
        fill="#FF6600">120</text>

  <!-- BPM label -->
  <text x="600" y="490" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="500" letter-spacing="8"
        fill="#4a4038">BPM · ALLEGRETTO</text>

  <!-- Beat dots row -->
  <g transform="translate(516, 524)">
    <circle cx="0"   cy="0" r="9" fill="#FF6600"/>
    <circle cx="36"  cy="0" r="7" fill="#27211a"/>
    <circle cx="68"  cy="0" r="7" fill="#27211a"/>
    <circle cx="100" cy="0" r="7" fill="#27211a"/>
    <circle cx="136" cy="0" r="9" fill="#27211a"/>
    <circle cx="172" cy="0" r="7" fill="#27211a"/>
  </g>

  <!-- Domain -->
  <text x="600" y="592" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="400" letter-spacing="2"
        fill="#2e2820">tictac.site</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="#1b1813"/>
</svg>
